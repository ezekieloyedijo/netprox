<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Illustration of a connected network: a core switch linked to a laptop, cloud, server rack, security shield and analytics screen">
  <style>
    .flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
    .flow.r{animation-direction:reverse}
    @keyframes flow{to{stroke-dashoffset:-64}}
    .pulse{animation:pulse 2.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.25)}}
    .blink{animation:blink 1.6s steps(2) infinite}
    .blink.d{animation-delay:.5s}.blink.e{animation-delay:1s}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse,.blink{animation:none}}
  </style>
  <defs>
    <linearGradient id="h-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F5266"/><stop offset="1" stop-color="#0A3F4F"/></linearGradient>
    <linearGradient id="h-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FE0E0"/><stop offset="1" stop-color="#01A9AD"/></linearGradient>
    <radialGradient id="h-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#01C3C3" stop-opacity=".45"/><stop offset="1" stop-color="#01C3C3" stop-opacity="0"/></radialGradient>
    <pattern id="h-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
  </defs>

  <rect width="560" height="480" fill="url(#h-grid)"/>
  <circle cx="280" cy="250" r="210" fill="url(#h-glow)"/>

  <!-- links -->
  <g fill="none" stroke="#01C3C3" stroke-width="2.5" stroke-linecap="round">
    <path class="flow" d="M280 250 C 220 200, 170 150, 120 118"/>
    <path class="flow r" d="M280 250 C 340 190, 400 140, 440 102"/>
    <path class="flow" d="M280 250 C 360 260, 420 270, 470 280"/>
    <path class="flow r" d="M280 250 C 220 300, 160 340, 110 370"/>
    <path class="flow" d="M280 250 C 310 320, 340 360, 380 400"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1.5">
    <path d="M120 118 C 240 70, 340 70, 440 102"/>
    <path d="M110 370 C 200 430, 300 440, 380 400"/>
    <path d="M470 280 C 480 330, 440 380, 380 400"/>
  </g>

  <!-- core switch -->
  <g transform="translate(190 206)">
    <rect x="-6" y="-6" width="192" height="100" rx="20" fill="#01C3C3" fill-opacity=".12"/>
    <rect width="180" height="88" rx="16" fill="url(#h-card)" stroke="#01C3C3" stroke-opacity=".6" stroke-width="1.5"/>
    <rect x="14" y="14" width="152" height="24" rx="6" fill="#072C38"/>
    <g fill="#01C3C3">
      <rect x="22" y="20" width="12" height="12" rx="2"/><rect x="40" y="20" width="12" height="12" rx="2" class="blink"/><rect x="58" y="20" width="12" height="12" rx="2"/>
      <rect x="76" y="20" width="12" height="12" rx="2" class="blink d"/><rect x="94" y="20" width="12" height="12" rx="2"/><rect x="112" y="20" width="12" height="12" rx="2" class="blink e"/>
      <rect x="130" y="20" width="12" height="12" rx="2"/><rect x="148" y="20" width="12" height="12" rx="2" fill-opacity=".4"/>
    </g>
    <rect x="14" y="48" width="152" height="24" rx="6" fill="#072C38"/>
    <g fill="#7FE3E3" fill-opacity=".7">
      <rect x="22" y="54" width="12" height="12" rx="2"/><rect x="40" y="54" width="12" height="12" rx="2"/><rect x="58" y="54" width="12" height="12" rx="2" class="blink e"/>
      <rect x="76" y="54" width="12" height="12" rx="2"/><rect x="94" y="54" width="12" height="12" rx="2" class="blink"/><rect x="112" y="54" width="12" height="12" rx="2"/>
    </g>
    <circle cx="146" cy="60" r="4" fill="#3FE0E0" class="blink d"/><circle cx="158" cy="60" r="4" fill="#FFFFFF" fill-opacity=".5"/>
  </g>

  <!-- laptop (top left) -->
  <g transform="translate(58 70)">
    <rect width="124" height="80" rx="10" fill="url(#h-card)" stroke="#FFFFFF" stroke-opacity=".25"/>
    <rect x="10" y="10" width="104" height="58" rx="5" fill="#072C38"/>
    <g stroke-linecap="round" stroke-width="4">
      <path d="M20 24h34" stroke="#01C3C3"/><path d="M60 24h22" stroke="#FFFFFF" stroke-opacity=".5"/>
      <path d="M28 36h46" stroke="#7FE3E3" stroke-opacity=".8"/><path d="M28 48h28" stroke="#FFFFFF" stroke-opacity=".4"/><path d="M62 48h30" stroke="#01C3C3"/>
      <path d="M20 60h20" stroke="#FFFFFF" stroke-opacity=".3"/>
    </g>
    <path d="M-10 84h144l-8 10H-2z" fill="#0F5266" stroke="#FFFFFF" stroke-opacity=".25"/>
  </g>

  <!-- cloud (top right) -->
  <g transform="translate(392 54)">
    <path d="M28 76h76a26 26 0 0 0 2-52 34 34 0 0 0-64-6A28 28 0 0 0 28 76z" fill="url(#h-card)" stroke="#01C3C3" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M56 50l10-10 10 10M66 40v24" fill="none" stroke="#3FE0E0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- server rack (right) -->
  <g transform="translate(444 226)">
    <rect width="88" height="112" rx="12" fill="url(#h-card)" stroke="#FFFFFF" stroke-opacity=".25"/>
    <g fill="#072C38"><rect x="10" y="12" width="68" height="22" rx="5"/><rect x="10" y="45" width="68" height="22" rx="5"/><rect x="10" y="78" width="68" height="22" rx="5"/></g>
    <g fill="#01C3C3"><circle cx="22" cy="23" r="4" class="blink"/><circle cx="22" cy="56" r="4" class="blink d"/><circle cx="22" cy="89" r="4" class="blink e"/></g>
    <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"><path d="M36 23h32M36 56h32M36 89h32"/></g>
  </g>

  <!-- shield (bottom left) -->
  <g transform="translate(62 318)">
    <circle cx="48" cy="54" r="46" fill="#01C3C3" class="pulse" fill-opacity=".25"/>
    <path d="M48 8l38 14v30c0 26-17 44-38 52C27 96 10 78 10 52V22z" fill="url(#h-card)" stroke="#01C3C3" stroke-width="2"/>
    <rect x="34" y="50" width="28" height="22" rx="4" fill="url(#h-teal)"/>
    <path d="M39 50v-7a9 9 0 0 1 18 0v7" fill="none" stroke="#3FE0E0" stroke-width="4"/>
    <circle cx="48" cy="61" r="3" fill="#072C38"/>
  </g>

  <!-- analytics screen (bottom right) -->
  <g transform="translate(324 368)">
    <rect width="132" height="88" rx="12" fill="url(#h-card)" stroke="#FFFFFF" stroke-opacity=".25"/>
    <g fill="#01C3C3"><rect x="16" y="52" width="14" height="22" rx="3" fill-opacity=".55"/><rect x="38" y="40" width="14" height="34" rx="3" fill-opacity=".7"/><rect x="60" y="30" width="14" height="44" rx="3"/><rect x="82" y="44" width="14" height="30" rx="3" fill-opacity=".7"/><rect x="104" y="22" width="14" height="52" rx="3" fill="#3FE0E0"/></g>
    <path d="M16 16h48" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- endpoints on links -->
  <g fill="#3FE0E0"><circle cx="280" cy="250" r="5"/></g>
  <g fill="#072C38" stroke="#01C3C3" stroke-width="3">
    <circle cx="120" cy="118" r="0"/>
  </g>
  <g fill="none" stroke="#01C3C3" stroke-width="3">
    <circle cx="36" cy="236" r="7" fill="#072C38"/><path d="M43 236h40" stroke-opacity=".6"/>
    <circle cx="524" cy="186" r="7" fill="#072C38"/><path d="M517 186h-40" stroke-opacity=".6"/>
    <circle cx="210" cy="444" r="7" fill="#072C38"/><path d="M210 437v-26" stroke-opacity=".6"/>
  </g>
</svg>
